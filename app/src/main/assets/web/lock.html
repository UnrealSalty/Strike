<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Strike</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <style>html,body,button,a,input{background:#0b0b0d;color:#f2f2f5;border:0}button{-webkit-appearance:none;appearance:none}</style>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/strike.css">
</head>
<body>

    <main class="lock">
        <img class="lock__brand" src="img/wordmark.webp" alt="Strike" width="144" height="20">
        <h1 class="lock__title">Enter PIN</h1>
        <p class="lock__sub" id="lockSub">Unlock Strike to continue.</p>
        <div id="lockPad"></div>
        <button class="btn btn--quiet lock__help" id="pinRecoveryOpen" type="button">Forgot PIN?</button>
    </main>

    <div class="modal" id="pinRecovery" hidden>
        <section class="modal__panel modal__panel--narrow" role="dialog" aria-modal="true" aria-labelledby="pinRecoveryTitle">
            <div class="modal__head">
                <span class="modal__title" id="pinRecoveryTitle">Forgot PIN</span>
                <button class="btn" id="pinRecoveryClose" type="button">Close</button>
            </div>
            <div class="modal__body">
                <p class="note">On a computer with an authorised ADB connection to the head unit, run:</p>
                <code class="lock__command">adb shell touch /data/local/tmp/.strike_pin_reset</code>
                <p class="note">Reopen or refresh Strike, then set a new PIN in Settings. Recordings and settings are kept.</p>
            </div>
        </section>
    </div>

    <script src="js/session.js"></script>
    <script src="js/core.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/keypad.js"></script>
    <script src="js/lock.js"></script>
</body>
</html>
